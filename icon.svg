  </defs>
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <!-- Hex shape -->
  <polygon points="64,20 98,38 98,74 64,92 30,74 30,38" fill="none" stroke="#ffd700" stroke-width="3"/>
